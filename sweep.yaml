program: scripts/sweep_agent.py
method: bayes
metric:
  name: fid_g2m
  goal: minimize
parameters:
  lambda_NCE:
    distribution: log_uniform_values
    min: 0.5
    max: 4.0
  nce_T:
    distribution: log_uniform_values
    min: 0.04
    max: 0.2
  lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.0004
