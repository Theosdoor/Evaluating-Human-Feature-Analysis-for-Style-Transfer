[project]
name = "acv-cswk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "clean-fid>=0.1.35",
    "dominate>=2.9.1",
    "flask>=3.1.3",
    "ipykernel>=7.2.0",
    "lpips>=0.1.4",
    "nbformat>=5.10.4",
    "numpy>=2.2.6",
    "opencv-python-headless>=4.0.0",
    "plotly>=6.6.0",
    "python-dotenv>=1.2.2",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
    "seaborn>=0.13.2",
    "timm>=1.0.25",
    "torch>=2.10.0",
    "torch-geometric>=2.7.0",
    "torchvision>=0.25.0",
    "tqdm>=4.67.3",
    "ultralytics>=8.4.14",
    "umap-learn>=0.5.11",
    "wandb>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.workspace]
members = [
    "external/contrastive-unpaired-translation",
]
